[package]
name = "higgsfield-kalkulator"
version = "0.1.0"
description = "Higgsfield-Kostenkalkulator"
authors = ["honkihonk01"]
edition = "2021"

[lib]
# Der Zusatz `_lib` hält den Bibliotheksnamen vom Programmnamen getrennt (Cargo-Eigenheit unter Windows).
name = "higgsfield_kalkulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
